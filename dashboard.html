<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DAVE Rankings</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f6; --line:#dde2ea;
    --text:#1f2733; --muted:#697384; --accent:#2f6feb; --accent2:#159c78;
    --warn:#c07a12; --danger:#d64550; --chip:#eef1f6;
    --on-accent:#ffffff;
    --scrim:rgba(31,39,51,.35); --scrim-strong:rgba(31,39,51,.45);
    --shadow:0 8px 24px rgba(23,35,58,.10);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0f1420; --panel:#161d2c; --panel2:#1d2637; --line:#2a3548;
    --text:#e8edf6; --muted:#93a1bd; --accent:#4f9dff; --accent2:#38d39f;
    --warn:#ffb020; --danger:#ff6b6b; --chip:#243049;
    --on-accent:#06101f;
    --scrim:rgba(4,8,16,.55); --scrim-strong:rgba(2,6,12,.62);
    --shadow:0 10px 30px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:20px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0 8px}
  .brand h1{margin:0;font-size:22px;letter-spacing:.3px}
  .brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:9px;
    padding:10px 16px;font-weight:650;cursor:pointer;font-size:13.5px;
    transition:filter .15s ease, transform .05s ease}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.6;cursor:default}
  .btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
  .meta-pill{color:var(--muted);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mode{padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
    border:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px}
  .mode.preseason{color:var(--accent2);border-color:color-mix(in srgb,var(--accent2) 45%,transparent)}
  .mode.in-season{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

  /* top nav */
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px}
  nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--muted);padding:11px 16px;cursor:pointer;font-weight:650;font-size:14px}
  nav.tabs button.active{color:var(--text);border-color:var(--accent)}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-6px 0 14px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:transparent;color:var(--muted);border:0;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
  .seg button.active{background:var(--accent);color:var(--on-accent)}
  .seg.alt button.active{background:var(--accent2)}
  input.search,select.sel{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:9px 12px;outline:none;font-size:13.5px}
  input.search{min-width:220px}
  input.search:focus,select.sel:focus{border-color:var(--accent)}
  input.num{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);
    padding:7px 8px;width:66px;font-size:13.5px;font-variant-numeric:tabular-nums;text-align:center}
  .muted{color:var(--muted)} .err{color:var(--danger)}
  .lbl{color:var(--muted);font-size:12px;font-weight:600}

  .banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 12%,var(--panel));
    border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:10px;padding:8px 12px;margin-bottom:12px}
  .chip{padding:2px 10px;border-radius:20px;background:var(--chip);border:1px solid var(--line);font-size:12px;font-weight:650}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  thead th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;
    padding:11px 12px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
  thead th.num,tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer;transition:background .12s ease}
  tbody tr:hover{background:var(--panel2)}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:0}
  .rk{color:var(--muted);font-variant-numeric:tabular-nums;width:44px;font-weight:700}
  .team{display:flex;align-items:center;gap:10px;min-width:0}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .logo{width:22px;height:22px;object-fit:contain;flex:none}
  .tname{font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conf{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .rating{font-weight:750;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700}
  .badge.inj{color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent)}
  .delta{font-size:11px;font-weight:700}
  .delta.up{color:var(--accent2)} .delta.down{color:var(--danger)}

  /* overlays: drawer (team) + modal (player/game) */
  .scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(600px,96vw);background:var(--panel);
    border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);
    transition:transform .22s ease;z-index:41;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dhead{padding:18px 20px;border-bottom:1px solid var(--line)}
  .dtitle{display:flex;align-items:center;gap:12px}
  .dtitle .logo{width:34px;height:34px}
  .dtitle h2{margin:0;font-size:19px}
  .close{margin-left:auto;background:var(--chip);border:1px solid var(--line);color:var(--text);
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:92px}
  .stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-weight:750;font-size:17px;font-variant-numeric:tabular-nums}
  .tabs2{display:flex;gap:6px;padding:12px 20px 0}
  .tabs2 button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);
    padding:8px 6px;cursor:pointer;font-weight:650;font-size:13px}
  .tabs2 button.active{color:var(--text);border-color:var(--accent)}
  .dbody{padding:14px 20px 26px;overflow:auto}
  .kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px}
  .kv .k{color:var(--muted)} .kv .v{text-align:right;font-variant-numeric:tabular-nums}
  .ptable{width:100%;border-collapse:collapse;margin-top:4px}
  .ptable td,.ptable th{padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:left}
  .ptable th.num,.ptable td.num{text-align:right;font-variant-numeric:tabular-nums}
  .ptable tr.clk{cursor:pointer} .ptable tr.clk:hover{background:var(--panel2)}
  .pill{padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:700;border:1px solid var(--line)}
  .pill.out{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
  .pill.limited{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .pill.recruit{color:var(--accent2);border-color:color-mix(in srgb,var(--accent2) 45%,transparent)}
  .g{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
  .g:hover{background:var(--panel2)}
  .g .wk{color:var(--muted);width:52px;font-size:12px}
  .g .res{width:20px;font-weight:800}
  .g .res.W{color:var(--accent2)} .g .res.L{color:var(--danger)}
  .g .sc{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}

  /* modal */
  .modal-scrim{position:fixed;inset:0;background:var(--scrim-strong);opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
  .modal-scrim.open{opacity:1;pointer-events:auto}
  .modal{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);
    width:min(640px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s, transform .18s}
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .mhead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .mhead h3{margin:0;font-size:17px} .mbody{padding:16px 18px}
  .seg-inj{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg-inj button{background:var(--panel2);border:0;color:var(--muted);padding:7px 13px;cursor:pointer;font-weight:650;font-size:12.5px}
  .seg-inj button.active-active{background:var(--accent2);color:var(--on-accent)}
  .seg-inj button.active-limited{background:var(--warn);color:var(--on-accent)}
  .seg-inj button.active-out{background:var(--danger);color:var(--on-accent)}
  .wfbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}

  /* prediction / impact */
  .pbars{display:flex;align-items:center;gap:10px;margin:8px 0}
  .winbar{flex:1;height:22px;border-radius:6px;overflow:hidden;display:flex;background:var(--panel2);border:1px solid var(--line)}
  .winbar>span{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:750;color:var(--on-accent)}
  .impact-meter{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .impact-meter>i{display:block;height:100%;background:linear-gradient(90deg,#9aa3b0,var(--warn),var(--danger))}
  .score{display:flex;gap:16px;align-items:center;justify-content:center;margin:10px 0}
  .score .t{text-align:center;min-width:120px}
  .score .pts{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .score .vs{color:var(--muted)}
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s}
  .mcard:hover{border-color:var(--accent)}
  .mcard .row{display:flex;align-items:center;gap:8px}
  .mcard .impact-tag{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
  .distbar{display:flex;height:44px;gap:2px;align-items:flex-end;margin:6px 0}
  .distbar .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
  .distbar .col>i{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:3px 3px 0 0;min-height:2px}
  .distbar .col span{font-size:9px;color:var(--muted)}

  /* bracket */
  .bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
  .round{min-width:210px;display:flex;flex-direction:column;gap:12px;justify-content:space-around}
  .round h4{margin:0 0 2px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .match{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
  .match:hover{border-color:var(--accent)}
  .match .side{display:flex;align-items:center;gap:8px;padding:8px 10px}
  .match .side+.side{border-top:1px solid var(--line)}
  .match .side.win{background:color-mix(in srgb,var(--accent2) 16%,transparent)}
  .match .seed{color:var(--muted);width:22px;font-size:12px;font-weight:700}
  .match .pr{margin-left:auto;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .champ{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),color-mix(in srgb,var(--accent2) 14%,transparent));
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:750;font-size:16px}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)} .empty h2{color:var(--text)}
  .progress{display:none;align-items:center;gap:12px;margin:8px 0 14px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .progress.show{display:flex}
  .pbar{flex:1;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
(function(){try{var t=localStorage.getItem("theme");
  if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>DAVE Rankings</h1><div class="sub">Power · Current · Predictive team ratings, players, and playoff odds</div></div>
    <div class="spacer"></div>
    <div class="meta-pill" id="metaPill"></div>
    <button class="btn ghost sm" id="themeBtn" title="Toggle light / dark theme" aria-label="Toggle light or dark theme">Dark mode</button>
    <button class="btn" id="updateBtn">Update data</button>
  </header>

  <nav class="tabs" id="topnav">
    <button data-tab="rankings" class="active">Rankings</button>
    <button data-tab="players">Players</button>
    <button data-tab="upcoming">Upcoming</button>
    <button data-tab="bracket">CFP Bracket</button>
    <button data-tab="matchup">Matchup Predictor</button>
  </nav>

  <div class="progress" id="progress">
    <div class="spin" id="spin"></div>
    <div class="pbar"><i id="pbarFill"></i></div>
    <div id="pstage" class="muted" style="min-width:190px;text-align:right"></div>
  </div>

  <div id="content"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modal-scrim" id="modalScrim"></div>
<div class="modal" id="modal" role="dialog"></div>

<script>
const state = { tab:"rankings", view:"current", unit:"overall", avail:"avail",
                week:null, overrides:{}, overrideMeta:{}, scenarioId:null, scenarioName:"",
                rankings:[], bracket:null, worldKey:null, worldMeta:{}, meta:{}, query:"",
                mc:null, mcKey:null, mcLoading:false, showOdds:false,
                polling:null, openTeamSchool:null, upcomingWeek:null, teamsList:null,
                playerRankings:null, playerFilters:null, matchupBasis:"current" };
const $ = s => document.querySelector(s);
const fmt = (n,d=1)=> (n===null||n===undefined||n==="")?"—":Number(n).toFixed(d);
const pct = n => (n===null||n===undefined)?"—":Math.round(n*100)+"%";
const pct1 = n => (n===null||n===undefined)?"—":(n*100).toFixed(1)+"%";
const el = (tag,attrs={},...kids)=>{const e=document.createElement(tag);
  for(const[k,v] of Object.entries(attrs)){ if(k==="class")e.className=v;
    else if(k==="html")e.innerHTML=v; else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==undefined)e.setAttribute(k,v);}
  for(const c of kids){ if(c==null)continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;};
const api = async (u,opt)=> (await fetch(u,opt)).json();
const apiPost = (u,body)=> api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

const RVIEW = {power:"Power", current:"Current", predictive:"Predictive"};
const VIEW_HINT = {
  power:"How good the roster is in theory — bottom-up player value. Best in the preseason.",
  current:"Power blended with results so far. Equals Power in the preseason; shifts toward results as games are played.",
  predictive:"Projected end-of-season: known results (through the selected week) plus a forecast of every remaining game.",
};
const UNIT_LABEL = {overall:"Overall", offense:"Offense", defense:"Defense", special:"Special teams"};

const getRating = (r,v=state.view,u=state.unit)=> r?.ratings?.[v]?.[u];
const getRank   = (r,v=state.view,u=state.unit)=> r?.ranks?.[v]?.[u];
const worldSpec = ()=> ({avail:state.avail, week:state.week, overrides:state.overrides});
const nOverrides = ()=> Object.keys(state.overrides).length;

/* ---------------- meta + world ---------------- */
async function loadMeta(){
  const m = await api("/api/meta"); state.meta = m;
  const pill = $("#metaPill"); pill.innerHTML="";
  if(m.has_data){
    pill.append(el("span",{class:"mode "+(m.mode||"")}, m.mode||""),
      el("span",{}, `${m.year} • ${m.team_count} teams`),
      el("span",{}, "Updated "+(m.generated? m.generated.replace("T"," "):"—")));
  } else pill.textContent="No data yet";
  return m;
}
async function loadWorld(){
  const w = await apiPost("/api/world", worldSpec());
  state.rankings = w.rankings||[]; state.bracket = w.bracket||null;
  state.worldKey = w.meta?.key; state.worldMeta = w.meta||{};
  // Monte Carlo odds are tied to a specific world; invalidate on change.
  if(state.mcKey!==state.worldKey){ state.mc=null; }
}
async function loadMC(force=false){
  if(!force && state.mc && state.mcKey===state.worldKey) return;
  state.mcLoading=true; if(state.tab==="rankings") renderTab();
  const r = await apiPost("/api/simulate", {...worldSpec(), n: state.meta.mc_sims||2000});
  state.mc = r.teams||{}; state.mcKey = state.worldKey; state.mcLoading=false;
  if(state.tab==="rankings") renderTab();
}

/* ---------------- top nav ---------------- */
function setTab(tab){
  state.tab=tab;
  [...$("#topnav").children].forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  renderTab();
}
function renderTab(){
  const c=$("#content"); c.innerHTML="";
  if(!state.rankings.length && state.tab!=="rankings"){ c.append(emptyState()); return; }
  if(state.tab==="rankings") return renderRankings(c);
  if(state.tab==="players") return renderPlayers(c);
  if(state.tab==="upcoming") return renderUpcoming(c);
  if(state.tab==="bracket") return renderBracket(c);
  if(state.tab==="matchup") return renderMatchup(c);
}
function emptyState(){
  return el("div",{class:"empty"}, el("h2",{},"No data yet"),
    el("p",{},"Pull the latest teams, stats, and player history to build the rankings."),
    el("button",{class:"btn",style:"margin-top:8px",onclick:doRefresh},"Update data"));
}

/* ---------------- Rankings view ---------------- */
async function changeWorld(){ await loadWorld(); if(state.view==="predictive" && state.showOdds) loadMC(); renderTab(); refreshOpenTeam(); }

function renderRankings(c){
  if(!state.rankings.length){ c.append(emptyState()); return; }

  // Row 1: unit + view + availability + filter
  const bar=el("div",{class:"toolbar"});
  const unitSeg=el("div",{class:"seg"});
  Object.entries(UNIT_LABEL).forEach(([k,lab])=>
    unitSeg.append(el("button",{class:state.unit===k?"active":"",onclick:()=>{state.unit=k;renderTab();}},lab)));
  const viewSeg=el("div",{class:"seg"});
  Object.entries(RVIEW).forEach(([k,lab])=>
    viewSeg.append(el("button",{class:state.view===k?"active":"",onclick:()=>{state.view=k; if(k==="predictive"&&state.showOdds)loadMC(); renderTab();}},lab)));
  const availSeg=el("div",{class:"seg alt"});
  [["avail","Available"],["full","Full strength"]].forEach(([k,lab])=>
    availSeg.append(el("button",{class:state.avail===k?"active":"",onclick:()=>{if(state.avail!==k){state.avail=k;state.teamsList=null;changeWorld();}}},lab)));
  const search=el("input",{class:"search",placeholder:"Filter team or conference...",value:state.query,
    oninput:e=>{state.query=e.target.value;renderTab();}});
  bar.append(unitSeg, viewSeg, availSeg, search);
  c.append(bar);

  // Row 2: timeline + scenarios (Current & Predictive only)
  if(state.view!=="power"){
    const t2=el("div",{class:"toolbar2"});
    const weeks=state.meta.weeks||[];
    const wkSel=el("select",{class:"sel",onchange:e=>{state.week=e.target.value===""?null:Number(e.target.value); state.scenarioId=null; state.scenarioName=""; changeWorld();}});

function activeScenarioSummary(){
  const parts=[]; if(state.week!=null) parts.push("as of Wk "+state.week);
  const n=nOverrides(); if(n) parts.push(n+" custom result"+(n>1?"s":""));
  if(state.scenarioName) return {label:state.scenarioName, detail:parts.join(" · ")};
  if(parts.length) return {label:"Custom what-if", detail:parts.join(" · ")};
  return null;
}
async function resetWorld(){ state.week=null; state.overrides={}; state.overrideMeta={}; state.scenarioId=null; state.scenarioName=""; await changeWorld(); }

/* ---------------- Scenario manager ---------------- */
async function openScenarioManager(){
  const m=$("#modal"); m.innerHTML=""; openModal();
  m.append(el("div",{class:"mhead"}, el("div",{}, el("h3",{},"What-if scenarios"),
      el("div",{class:"muted",style:"font-size:12.5px"},"Set an as-of week, edit results from any game, and save named worlds.")),
    el("button",{class:"close",style:"margin-left:auto",onclick:closeModal},"✕")));
  const body=el("div",{class:"mbody"});

  // Current what-ifs
  body.append(el("div",{style:"font-weight:700;margin-bottom:4px"},"Active what-if"));
  const wk = state.week==null? "Full season" : ("As of Wk "+state.week);
  body.append(el("div",{class:"muted",style:"font-size:12.5px;margin-bottom:8px"}, `Timeline: ${wk} · ${nOverrides()} custom result(s)`));
  const ovs=Object.entries(state.overrides);
  if(ovs.length){
    for(const [gid,sc] of ovs){
      const meta=state.overrideMeta[gid];
      body.append(el("div",{class:"g",style:"cursor:default"},
        el("span",{}, meta?meta.label:`Game ${gid}`),
        el("span",{class:"sc"}, `${sc.awayPoints}-${sc.homePoints}`),
        el("button",{class:"btn ghost sm",style:"margin-left:8px",onclick:()=>{delete state.overrides[gid]; delete state.overrideMeta[gid]; state.scenarioId=null; state.scenarioName=""; openScenarioManager(); changeWorld();}},"remove")));
    }
    body.append(el("button",{class:"btn ghost sm",style:"margin-top:8px",onclick:()=>{state.overrides={};state.overrideMeta={};state.scenarioId=null;state.scenarioName="";openScenarioManager();changeWorld();}},"Clear all"));
  } else {
    body.append(el("div",{class:"muted",style:"font-size:12.5px"},"No custom results yet. Open any game (Upcoming, a team's schedule, or the bracket) and use “What-if result” to set a score."));
  }

  // Save
  body.append(el("div",{style:"font-weight:700;margin:16px 0 6px"},"Save this scenario"));
  const nameInp=el("input",{class:"search",placeholder:"Scenario name...",value:state.scenarioName||"",style:"min-width:220px"});
  const saveMsg=el("span",{class:"muted",style:"margin-left:8px;font-size:12px"},"");
  body.append(el("div",{class:"toolbar"}, nameInp,
    el("button",{class:"btn sm",onclick:async()=>{
      const nm=nameInp.value.trim()||"Untitled scenario";
      saveMsg.textContent="saving…";
      const res=await apiPost("/api/scenarios",{id:state.scenarioId,name:nm,as_of_week:state.week,overrides:state.overrides});
      state.scenarioId=res.id; state.scenarioName=nm; saveMsg.textContent="saved."; openScenarioManager(); renderTab();
    }},"Save"), saveMsg));

  // Saved scenarios
  body.append(el("div",{style:"font-weight:700;margin:16px 0 6px"},"Saved scenarios"));
  const list=el("div",{}); body.append(list);
  const data=await api("/api/scenarios");
  const items=data.scenarios||[];
  if(!items.length){ list.append(el("div",{class:"muted",style:"font-size:12.5px"},"None saved yet.")); }
  for(const s of items){
    const det=[s.as_of_week!=null?("Wk "+s.as_of_week):"full season", `${Object.keys(s.overrides||{}).length} result(s)`].join(" · ");
    list.append(el("div",{class:"g",style:"cursor:default"},
      el("span",{}, el("b",{},s.name)), el("span",{class:"muted",style:"margin-left:8px;font-size:12px"},det),
      el("span",{class:"spacer",style:"flex:1"}),
      el("button",{class:"btn sm",style:"margin-right:6px",onclick:()=>applyScenario(s)},"Apply"),
      el("button",{class:"btn ghost sm",onclick:async()=>{await fetch("/api/scenarios/"+encodeURIComponent(s.id),{method:"DELETE"}); openScenarioManager();}},"Delete")));
  }
  m.append(body);
}
async function applyScenario(s){
  state.week = (s.as_of_week==null? null : Number(s.as_of_week));
  state.overrides = {...(s.overrides||{})}; state.overrideMeta={};
  state.scenarioId = s.id; state.scenarioName = s.name;
  if(state.view==="power") state.view="predictive";
  closeModal(); await changeWorld();
}

      el("td",{class:"conf"}, p.team),
      el("td",{class:"conf"}, p.conference||"—"),
      el("td",{class:"num muted"}, p.class||"—"),
      el("td",{class:"num"}, el("div",{}, el("div",{class:"rating"},fmt(p.value,1)),
        el("div",{class:"bar"}, el("i",{style:`width:${Math.max(0,Math.min(100,(p.value/max)*100))}%`})))),
      el("td",{class:"num muted"}, p.ppa_recent==null?"—":fmt(p.ppa_recent,1)),
      el("td",{}, st)));
  });
  c.append(el("table",{}, el("thead",{}, el("tr",{},
    el("th",{class:"num"},"#"),el("th",{},"Player"),el("th",{},"Pos"),el("th",{},"Team"),
    el("th",{},"Conf"),el("th",{class:"num"},"Cls"),el("th",{class:"num"},"Value"),
    el("th",{class:"num"},"Last PPA"),el("th",{},""))), tb));
  if(rows.length>300) c.append(el("div",{class:"muted",style:"margin-top:8px"},"Showing top 300 — narrow with filters."));

async function doRefresh(){
  const btn=$("#updateBtn"); btn.disabled=true; $("#progress").classList.add("show"); setProgress("Starting...",0);
  await fetch("/api/refresh",{method:"POST"});
  if(state.polling) clearInterval(state.polling);
  state.polling=setInterval(pollStatus,1200);

function setProgress(stage,frac){ $("#pstage").textContent=stage||""; $("#pbarFill").style.width=Math.round((frac||0)*100)+"%"; }
async function pollStatus(){
  const s=await api("/api/status");
  setProgress(s.progress?.stage,s.progress?.frac); $("#spin").style.display=s.state==="running"?"block":"none";
  if(s.state==="done"){ clearInterval(state.polling); state.polling=null; $("#pstage").textContent=s.message||"Done";
    setTimeout(()=>$("#progress").classList.remove("show"),1200); $("#updateBtn").disabled=false;
    state.teamsList=null; state.playerRankings=null; state.mc=null;
    await loadMeta(); await loadWorld(); renderTab();
  } else if(s.state==="error"){ clearInterval(state.polling); state.polling=null;
    $("#pstage").innerHTML=`<span class="err">${s.message||"Error"}</span>`; $("#spin").style.display="none"; $("#updateBtn").disabled=false; }
}

$("#updateBtn").addEventListener("click",doRefresh);

function syncThemeBtn(){ const dark=document.documentElement.getAttribute("data-theme")==="dark";
  $("#themeBtn").textContent = dark ? "Light mode" : "Dark mode"; }
$("#themeBtn").addEventListener("click",()=>{
  const next = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("theme",next); }catch(e){}
  syncThemeBtn();
});
syncThemeBtn();
$("#scrim").addEventListener("click",closeDrawer);
$("#modalScrim").addEventListener("click",closeModal);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#modal").classList.contains("open")) closeModal(); else closeDrawer(); } });

(async function init(){
  const m=await loadMeta();
  if(m.has_data) await loadWorld();
  renderTab();
  if(m.status && m.status.state==="running"){ $("#progress").classList.add("show"); $("#updateBtn").disabled=true; state.polling=setInterval(pollStatus,1200); }
})();
</script>
</body>
